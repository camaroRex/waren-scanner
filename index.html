<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Waren-Scanner</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scanner">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">

  <script src="https://unpkg.com/@zxing/library@latest"></script>
  
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
      touch-action: manipulation;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 500px;
      margin: 0 auto;
      padding: env(safe-area-inset-top, 10px) 12px env(safe-area-inset-bottom, 10px) 12px;
    }

    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 8px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { background: #1d4ed8; }
    button.secondary { background: #475569; }
    button.scan-btn { background: #059669; font-size: 15px; padding: 14px; width: 100%; }
    button.stop { background: #dc2626; }

    #video-container {
      position: relative;
      width: 100%;
      height: 200px;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      display: none;
      margin-top: 8px;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .alert-box {
      padding: 10px 12px;
      border-radius: 8px;
      margin-top: 8px;
      font-size: 14px;
      font-weight: bold;
      display: none;
      line-height: 1.3;
    }
    .alert-success { background: #065f46; color: #a7f3d0; }
    .alert-warn { background: #854d0e; color: #fef08a; }
    .alert-error { background: #991b1b; color: #fecaca; }

    .list-wrapper {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      background: #1e293b;
      border-radius: 12px;
      padding: 10px 12px;
    }

    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 4px;
      border-bottom: 1px solid #334155;
      font-size: 13px;
    }
    li.checked {
      background: #064e3b;
      color: #94a3b8;
      border-radius: 6px;
      padding: 8px;
      text-decoration: line-through;
    }
    .badge {
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge-pending { background: #334155; color: #cbd5e1; }
    .badge-done { background: #10b981; color: white; text-decoration: none !important; }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- Vorlagen-Auswahl -->
    <div class="card">
      <div style="font-size: 12px; color: #94a3b8; margin-bottom: 6px;">Auftrag auswählen:</div>
      <div class="btn-row">
        <button onclick="loadPreset('AG3649')">AG3649 laden</button>
        <button class="secondary" onclick="loadPreset('LS1393')">LS1393 laden</button>
      </div>
    </div>

    <!-- Scanner Steuerung -->
    <div class="card">
      <button id="toggleScanBtn" class="scan-btn" onclick="toggleScanner()">Kamera starten</button>
      <div id="video-container">
        <video id="video"></video>
      </div>
      <div id="statusAlert" class="alert-box"></div>
    </div>

    <!-- Status & Artikelliste -->
    <div class="list-wrapper">
      <div style="display:flex; justify-content:space-between; margin-bottom: 6px; font-weight: 600; font-size: 13px;">
        <span id="listTitle">Kein Auftrag geladen</span>
        <span id="count">0/0</span>
      </div>
      <ul id="itemList"></ul>
    </div>

  </div>

  <script>
    const PRESETS = {
      AG3649: [
        ["0901796718", "2"], ["0902541356", "92"], ["0901796740", "11"], ["0901796715", "8"],
        ["0902472315", "3"], ["0901796656", "4"], ["0902472319", "2"], ["0901995185", "3"],
        ["0902541430", "6"], ["0901796741", "5"], ["0902517125", "1"], ["0901796651", "9"],
        ["0903425843", "1"], ["0903425850", "1"], ["0902517127", "5"], ["0902517128", "1"],
        ["0902517111", "1"], ["0902517097", "6"], ["03201000125LE", "2"], ["01250400150LE", "2"],
        ["H78180", "1"], ["H78167", "2"], ["H78170", "2"], ["H78164", "2"],
        ["H152255", "1"], ["H152252", "2"], ["H152253", "2"], ["H146253", "1"],
        ["DK5G4010D80", "1"], ["DK5G1H10560", "1"], ["0907126973", "18"], ["0907126976", "8"],
        ["0907126978", "16"], ["0907126979", "4"], ["0907127050", "18"], ["0907127051", "10"],
        ["0907127052", "6"], ["930144", "4"], ["930309", "4"]
      ],
      LS1393: [
        ["0901796656", "5"], ["0902517125", "1"], ["0902517128", "1"], ["0901796718", "6"],
        ["0901796715", "2"], ["0903428967", "1"], ["0903759389", "2"], ["0902759387", "1"],
        ["0901796651", "6"], ["0901995185", "3"], ["0902541430", "6"], ["0902541356", "80"],
        ["0902759470", "1"], ["0903430765", "1"], ["0902517127", "3"], ["0901796740", "14"],
        ["0901796741", "2"], ["0903425843", "1"], ["03360100065LE", "2"], ["0125040080LE", "2"],
        ["01250100040LE", "1"], ["0907126973", "12"], ["0907126976", "10"], ["0907126978", "4"],
        ["0907126979", "12"], ["0907127052", "6"], ["0907127050", "28"], ["0907127051", "4"],
        ["DK5G4010D80", "2"], ["DK5G1H10560", "2"], ["930144", "14"]
      ]
    };

    let expectedItems = new Map();
    let codeReader = null;
    let isScanning = false;
    let lastScannedCode = null;
    let lastScanTime = 0;

    function cleanString(str) {
      return str.replace(/[^0-9A-Za-z]/g, '').trim();
    }

    function loadPreset(name) {
      expectedItems.clear();
      PRESETS[name].forEach(item => {
        expectedItems.set(cleanString(item[0]), { targetQty: item[1], done: false });
      });
      document.getElementById('listTitle').innerText = name;
      updateUI();
      showAlert(`${name}: ${expectedItems.size} Positionen geladen.`, 'success');
    }

    function toggleScanner() {
      isScanning ? stopScanner() : startScanner();
    }

    function startScanner() {
      if (expectedItems.size === 0) {
        return showAlert('Bitte zuerst oben einen Auftrag auswählen!', 'warn');
      }

      codeReader = new ZXing.BrowserMultiFormatReader();
      document.getElementById('video-container').style.display = 'block';
      const btn = document.getElementById('toggleScanBtn');
      btn.innerText = 'Scanner stoppen';
      btn.className = 'scan-btn stop';
      isScanning = true;

      // Erzwingt Full-HD-Rückkamera für gestochen scharfen Barcode-Fokus
      const constraints = {
        video: {
          facingMode: 'environment',
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      };

      codeReader.decodeFromConstraints(constraints, 'video', (result, err) => {
        if (result) handleScannedData(result.getText());
      }).catch(err => {
        showAlert('Kamerafehler: ' + err, 'error');
        stopScanner();
      });
    }

    function stopScanner() {
      if (codeReader) {
        codeReader.reset();
        codeReader = null;
      }
      document.getElementById('video-container').style.display = 'none';
      const btn = document.getElementById('toggleScanBtn');
      btn.innerText = 'Kamera starten';
      btn.className = 'scan-btn';
      isScanning = false;
    }

    function handleScannedData(raw) {
      const now = Date.now();
      if (raw === lastScannedCode && (now - lastScanTime) < 2000) return;
      lastScannedCode = raw;
      lastScanTime = now;

      if (navigator.vibrate) navigator.vibrate(80);

      const clean = cleanString(raw);
      if (expectedItems.has(clean)) {
        const item = expectedItems.get(clean);
        item.done = true;
        showAlert(`GEFUNDEN: <strong>${clean}</strong><br>Soll-Menge: <strong>${item.targetQty} Stück</strong>`, 'success');
        updateUI();
      } else {
        showAlert(`NICHT IM AUFTRAG: ${clean}`, 'error');
      }
    }

    function updateUI() {
      const listEl = document.getElementById('itemList');
      listEl.innerHTML = '';
      let done = 0;

      expectedItems.forEach((val, key) => {
        const li = document.createElement('li');
        if (val.done) {
          li.className = 'checked';
          done++;
          li.innerHTML = `<span>${key} (${val.targetQty} Stk.)</span><span class="badge badge-done">OK</span>`;
        } else {
          li.innerHTML = `<span>${key} (${val.targetQty} Stk.)</span><span class="badge badge-pending">Offen</span>`;
        }
        listEl.appendChild(li);
      });

      document.getElementById('count').innerText = `${done}/${expectedItems.size}`;
    }

    function showAlert(msg, type) {
      const el = document.getElementById('statusAlert');
      el.style.display = 'block';
      el.className = `alert-box alert-${type}`;
      el.innerHTML = msg;
    }
  </script>
</body>
</html>
